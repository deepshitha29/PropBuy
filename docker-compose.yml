services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: propbuy
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-propbuy_dev}
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/propbuy?serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-propbuy_dev}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET to a strong random secret of at least 32 characters}
      PORT: 8080
      UPLOAD_DIR: /app/uploads
    ports: ["8080:8080"]
    volumes:
      - uploads_data:/app/uploads
volumes:
  mysql_data: {}
  uploads_data: {}
